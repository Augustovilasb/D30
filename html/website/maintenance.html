<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D30 — Em manutenção</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0f;
    color: #e8e8ec;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding: 24px;
  }

  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #fff;
    margin-bottom: 40px;
  }

  .logo span {
    color: #6d5ce6;
  }

  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    background: rgba(109, 92, 230, 0.12);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }

  p {
    font-size: 15px;
    color: #8b8b9a;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .divider {
    width: 40px;
    height: 2px;
    background: #6d5ce6;
    border-radius: 2px;
    margin: 28px auto;
  }

  .contact {
    font-size: 13px;
    color: #55555f;
  }

  .contact a {
    color: #6d5ce6;
    text-decoration: none;
  }

  .contact a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">D<span>30</span></div>

    <div class="icon">🔧</div>

    <h1>Estamos em manutenção</h1>
    <p>A plataforma está temporariamente fora do ar enquanto realizamos melhorias importantes.</p>
    <p>Voltamos em breve.</p>

    <div class="divider"></div>

    <p class="contact">
      Dúvidas? <a href="mailto:contato@d30.com.br">contato@d30.com.br</a>
    </p>
  </div>
</body>
</html>
