<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D30 — Em breve</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="description" content="A comunidade de desenvolvedores D30 está chegando.">
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0a0a0c;
    --surface: #111114;
    --border:  #1e1e24;
    --purple:  #6d5ce6;
    --purple2: #8b7cf8;
    --text:    #e4e4ec;
    --muted:   #6b6b7a;
    --faint:   #1a1a22;
  }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    overflow: hidden;
  }

  /* background glow */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(109,92,230,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 520px;
    width: 100%;
    text-align: center;
  }

  /* logo */
  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    background: var(--purple);
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.5px;
  }

  /* badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(109,92,230,0.1);
    border: 1px solid rgba(109,92,230,0.25);
    border-radius: 99px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--purple2);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--purple2);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.8); }
  }

  /* headline */
  h1 {
    font-size: clamp(36px, 7vw, 56px);
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1.08;
    color: #fff;
    margin-bottom: 20px;
  }

  h1 span {
    background: linear-gradient(135deg, var(--purple) 0%, var(--purple2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* sub */
  .sub {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.65;
    max-width: 380px;
    margin: 0 auto 48px;
  }

  /* divider */
  .divider {
    width: 40px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 48px;
  }

  /* features */
  .features {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 56px;
  }

  .feat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .feat-icon {
    font-size: 14px;
  }

  /* footer */
  .foot {
    font-size: 12px;
    color: #3a3a45;
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="logo">
      <span class="logo-mark">D3</span>
      D30
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      Em breve
    </div>

    <h1>A comunidade<br>dos <span>devs sérios</span></h1>

    <p class="sub">
      Roadmap, tracker de estudos, fórum e ranking.<br>
      Tudo que você precisa para evoluir de verdade.
    </p>

    <div class="divider"></div>

    <div class="features">
      <div class="feat"><span class="feat-icon">📍</span> Roadmap</div>
      <div class="feat"><span class="feat-icon">⏱</span> Study Tracker</div>
      <div class="feat"><span class="feat-icon">💬</span> Fórum</div>
      <div class="feat"><span class="feat-icon">🏆</span> Ranking</div>
      <div class="feat"><span class="feat-icon">🎙</span> Palestras</div>
    </div>

    <p class="foot">d30.com.br</p>

  </div>
</body>
</html>
