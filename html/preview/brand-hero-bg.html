<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../css/_card.css"></head><body>
<div class="card">
  <div style="position:relative;height:120px;background:#080808;border-radius:12px;overflow:hidden">
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px, transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse 70% 80% at 50% 50%,black 0%, transparent 100%)"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(139,124,248,0.18) 0%, transparent 70%), radial-gradient(ellipse 40% 30% at 80% 100%, rgba(109,92,230,0.10) 0%, transparent 60%)"></div>
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:#8b7cf8"></div>
    <div style="position:absolute;left:calc(50% - 8px);top:calc(50% - 8px);width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(139,124,248,0.5);transform:translate(-50%,-50%)"></div>
  </div>

</div></body></html>
