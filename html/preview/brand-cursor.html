<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../css/_card.css"></head><body>
<div class="card">
  <div class="row" style="gap:24px;align-items:center">
    <div style="position:relative;width:140px;height:80px;background:#0f0f0f;border:1px solid rgba(255,255,255,0.07);border-radius:8px;overflow:hidden">
      <div style="position:absolute;left:50px;top:30px;width:6px;height:6px;border-radius:50%;background:#8b7cf8"></div>
      <div style="position:absolute;left:32px;top:12px;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(139,124,248,0.5)"></div>
    </div>
    <div style="position:relative;width:140px;height:80px;background:#0f0f0f;border:1px solid rgba(255,255,255,0.07);border-radius:8px;overflow:hidden">
      <div style="position:absolute;left:50px;top:30px;width:6px;height:6px;border-radius:50%;background:#8b7cf8"></div>
      <div style="position:absolute;left:18px;top:-2px;width:64px;height:64px;border-radius:50%;border:1.5px solid #8b7cf8;background:rgba(139,124,248,0.15)"></div>
    </div>
    <div style="position:relative;width:140px;height:80px;background:#0f0f0f;border:1px solid rgba(255,255,255,0.07);border-radius:8px;overflow:hidden">
      <div style="position:absolute;left:50px;top:30px;width:6px;height:6px;border-radius:50%;background:#8b7cf8"></div>
      <div style="position:absolute;left:36px;top:16px;width:28px;height:28px;border-radius:50%;border:1.5px solid #8b7cf8;background:rgba(139,124,248,0.3)"></div>
    </div>
  </div>
  <div class="row" style="gap:24px"><span class="mono" style="width:140px;text-align:center">idle 36px</span><span class="mono" style="width:140px;text-align:center">hover 64px</span><span class="mono" style="width:140px;text-align:center">press 28px</span></div>
  <div class="note">Custom cursor: <span class="value">6px</span> purple dot tracks 1:1 + <span class="value">36px</span> ring lags 18% per frame. Ring inflates on <span class="value">[data-cursor="hover"]</span>, shrinks + fills on press. Body sets <span class="value">cursor: none</span>; disabled below 768px.</div>
</div></body></html>
