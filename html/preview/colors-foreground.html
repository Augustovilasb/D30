<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../css/_card.css"></head><body>
<div class="card tight">
  <div class="row" style="gap:8px">
    <div class="swatch" style="background:#0f0f0f;border-color:rgba(255,255,255,0.07)">
      <div class="name" style="color:#f0f0f0">text</div>
      <div class="hex" style="color:#f0f0f0">#f0f0f0</div>
    </div>
    <div class="swatch" style="background:#0f0f0f;border-color:rgba(255,255,255,0.07)">
      <div class="name" style="color:#888">muted</div>
      <div class="hex" style="color:#888">#888888</div>
    </div>
    <div class="swatch" style="background:#0f0f0f;border-color:rgba(255,255,255,0.07)">
      <div class="name" style="color:#555">muted-2</div>
      <div class="hex" style="color:#555">#555555</div>
    </div>
  </div>
  <div class="note">Three foreground tones. Body copy uses <span class="value">muted</span> by default; <span class="value">text</span> is reserved for headlines and the strong contrast moments inside body.</div>
</div></body></html>
