<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../css/_card.css"></head><body>
<div class="card">
  <div class="row" style="gap:18px;justify-content:space-around">
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:120px;height:80px;background:#0f0f0f;border:1px solid rgba(255,255,255,0.07);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.4)"></div>
      <span class="mono">shadow-card</span>
      <span class="note" style="font-size:9px;text-align:center">0 8 24 / .40 black</span>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:120px;height:80px;background:#0f0f0f;border:1px solid rgba(255,255,255,0.07);border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,0.5)"></div>
      <span class="mono">shadow-modal</span>
      <span class="note" style="font-size:9px;text-align:center">0 12 32 / .50 black</span>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:80px;height:80px;background:linear-gradient(135deg,#4c3db5,#8b7cf8);border-radius:50%;box-shadow:0 0 0 2px rgba(139,124,248,0.25), 0 8px 28px rgba(139,124,248,0.25)"></div>
      <span class="mono">shadow-purple</span>
      <span class="note" style="font-size:9px;text-align:center">ring + 0 8 28 / .25 purple</span>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:24px;height:24px;background:#080808;border:2px solid #8b7cf8;border-radius:50%;box-shadow:0 0 20px rgba(139,124,248,0.7);align-self:center;margin:28px 0"></div>
      <span class="mono">glow-purple</span>
      <span class="note" style="font-size:9px;text-align:center">0 0 20 / .70 (active state)</span>
    </div>
  </div>
</div></body></html>
