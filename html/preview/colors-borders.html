<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../css/_card.css"></head><body>
<div class="card tight">
  <div class="col" style="gap:10px">
    <div style="height:1px;background:rgba(255,255,255,0.07);width:100%"></div>
    <div class="row" style="justify-content:space-between"><span class="mono">border</span><span class="mono">rgba(255,255,255,0.07)</span></div>
    <div style="height:1px;background:rgba(255,255,255,0.12);width:100%"></div>
    <div class="row" style="justify-content:space-between"><span class="mono">border-2</span><span class="mono">rgba(255,255,255,0.12)</span></div>
    <div style="height:1px;background:rgba(139,124,248,0.25);width:100%"></div>
    <div class="row" style="justify-content:space-between"><span class="mono">border-purple-soft</span><span class="mono">rgba(139,124,248,0.25)</span></div>
    <div style="height:1px;background:rgba(139,124,248,0.5);width:100%"></div>
    <div class="row" style="justify-content:space-between"><span class="mono">border-purple-focus</span><span class="mono">rgba(139,124,248,0.5)</span></div>
  </div>
